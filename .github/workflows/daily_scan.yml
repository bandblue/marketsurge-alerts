name: MarketSurge Daily Pre-Market Scan

on:
  schedule:
    # Backup schedule at 13:37 UTC (6:37 AM MST) Mon-Fri
    - cron: '37 13 * * 1-5'
  workflow_dispatch: # Triggered reliably at 6:37 AM MST via cron-job.org

permissions:
  contents: write

jobs:
  update-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy scipy yfinance requests lxml beautifulsoup4 google-api-python-client google-auth

      - name: Run 1/3 RS & Technical Screener
        run: python screener.py

      - name: Run 2/3 Base Pattern & EPS Scanner
        run: python base_and_eps_scanner.py

      - name: Run 3/3 Higher High / Higher Low Screener
        run: python hh_hl_screener.py

      - name: Sync CSVs to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python sync_to_gdrive.py

      - name: Commit and push updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketsurge_rankings.csv marketsurge_actionable_setups.csv marketsurge_hh_hl_setups.csv
          git diff --staged --quiet || git commit -m "Auto-update daily watchlist"
          git push
