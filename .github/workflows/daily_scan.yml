name: MarketSurge Daily Pre-Market Scan

on:
  schedule:
    - cron: '0 13 * * 1-5'   # Runs Mon-Fri at 13:00 UTC (6:00 AM MST / 8:00 AM EST)
  workflow_dispatch:         # Allows manual trigger from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-watchlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 1/4 RS & Technical Screener
        run: python screener.py

      - name: Run 2/4 Base Pattern & EPS Scanner
        run: python base_and_eps_scanner.py

      - name: Run 3/4 Higher High / Higher Low Screener
        run: python hh_hl_screener.py

      - name: Run 4/4 Best Stocks in the Market Screener
        run: python best_stocks_screener.py

      - name: Sync CSVs to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python sync_to_gdrive.py

      - name: Send ntfy Push Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            COUNT_CS=$(($(wc -l < marketsurge_actionable_setups.csv) - 1))
            COUNT_HH=$(($(wc -l < marketsurge_hh_hl_setups.csv) - 1))
            COUNT_JB=$(($(wc -l < josh_brown_best_stocks.csv) - 1))
            curl -s \
              -H "Title: MarketSurge Pre-Market Scan Complete" \
              -H "Priority: default" \
              -H "Tags: chart_with_upwards_trend" \
              -d "CAN SLIM Setups: $COUNT_CS | HH/HL: $COUNT_HH | Josh Brown Best Stocks: $COUNT_JB" \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi
      - name: Commit and push updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketsurge_rankings.csv marketsurge_actionable_setups.csv marketsurge_hh_hl_setups.csv josh_brown_best_stocks.csv
          git commit -m "Auto-update daily watchlist" || exit 0
          git pull --rebase origin main
          git push
