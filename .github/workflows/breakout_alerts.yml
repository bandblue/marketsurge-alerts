name: MarketSurge Intraday Breakout Watcher

on:
  workflow_dispatch: # Triggered every 5 mins Mon-Fri (7:30 AM - 2:00 PM MST) via cron-job.org

permissions:
  contents: write

jobs:
  check-breakouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas yfinance requests tzdata

      - name: Run Breakout Watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python breakout_watcher.py

      - name: Save alerted_today state so duplicate alerts don't fire
        run: |
          if [ -f alerted_today.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alerted_today.json
            git diff --staged --quiet || git commit -m "Update daily alert state"
            git push
          fi
