name: MarketSurge Intraday Breakout Watcher

on:
  workflow_dispatch: # Triggered every 5 mins Mon-Fri (7:30 AM - 2:00 PM MST) via cron-job.org

permissions:
  contents: write

jobs:
  check-breakouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas yfinance requests tzdata google-api-python-client google-auth

      - name: Run Breakout Watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python breakout_watcher.py

      - name: Sync updated setups to Google Drive if changed
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if ! git diff --quiet marketsurge_actionable_setups.csv; then
            python sync_to_gdrive.py
          fi

      - name: Save alerted_today state and updated setups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerted_today.json marketsurge_actionable_setups.csv
          git diff --staged --quiet || git commit -m "Update daily alert state and setups"
          git push
