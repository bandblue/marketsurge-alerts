name: MarketSurge Intraday Breakout Watcher

on:
  schedule:
    # 7:30 AM – 7:55 AM MST (14:30 – 14:55 UTC)
    - cron: '30,35,40,45,50,55 14 * * 1-5'
    # 8:00 AM – 1:55 PM MST (15:00 – 20:55 UTC)
    - cron: '*/5 15-20 * * 1-5'
    # 2:00 PM MST closing check (21:00 UTC)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual "Run workflow" testing anytime

permissions:
  contents: write

jobs:
  check-breakouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas yfinance requests tzdata

      - name: Run Breakout Watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python breakout_watcher.py

      - name: Save alerted_today state so duplicate alerts don't fire
        run: |
          if [ -f alerted_today.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alerted_today.json
            git diff --staged --quiet || git commit -m "Update daily alert state"
            git push
          fi
