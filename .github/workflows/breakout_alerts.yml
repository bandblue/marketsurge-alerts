name: MarketSurge Intraday Breakout Watcher

on:
  workflow_dispatch: # Allows manual testing & external triggers (cron-job.org every 5 mins Mon-Fri 7:30 AM - 2:00 PM MST)
  schedule:
    - cron: '*/15 14-21 * * 1-5' # Built-in GitHub fallback every 15 mins during US market hours (14:00-21:59 UTC / 7:00 AM-2:59 PM MST)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-breakouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt tzdata

      - name: Run Breakout Watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python breakout_watcher.py

      - name: Sync updated setups to Google Drive if changed
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if ! git diff --quiet marketsurge_actionable_setups.csv; then
            python sync_to_gdrive.py
          fi

      - name: Save alerted_today state and updated setups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerted_today.json marketsurge_actionable_setups.csv
          git diff --staged --quiet || git commit -m "Update daily alert state and setups"
          git pull --rebase origin main
          git push
