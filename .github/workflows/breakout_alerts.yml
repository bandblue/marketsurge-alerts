name: MarketSurge Intraday Breakout Watcher

on:
  schedule:
    # Runs every 5 minutes, Mon-Fri, during US market hours (13:30 - 21:55 UTC covers both EST & EDT)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch: # Allows manual "Run workflow" testing anytime

permissions:
  contents: write

jobs:
  check-breakouts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas yfinance requests tzdata

      - name: Run Breakout Watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python breakout_watcher.py

      - name: Save alerted_today state so duplicate alerts don't fire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerted_today.json
          git diff --staged --quiet || git commit -m "Update daily alert state"
          git push
